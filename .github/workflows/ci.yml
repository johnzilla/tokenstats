# Tests every PR and push to main (mirrors arbstr's `test` job) and builds +
# smoke-tests the Docker image. On main, that exact image is pushed to
# ghcr.io/<owner>/tokenstats as :latest and :sha-<short>; the Droplet pulls it
# (docs/DEPLOY.md §6). Single-arch amd64, matching the Droplet.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/tokenstats

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Pinned so a new stable release can't add lint failures overnight.
      # Bump deliberately, together with any fixes the new clippy asks for.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The Dockerfile builds with rust:1.86 (Cargo.toml rust-version), so make
  # sure nothing newer slips in. Keep all three in step when bumping.
  msrv:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # The Dockerfile is what production builds; make sure it still does.
  docker:
    # Only a fully green main gets published.
    needs: [test, msrv]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tokenstats:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
      - name: Smoke test the image
        run: |
          docker run -d --name ts -p 127.0.0.1:8080:8080 tokenstats:ci serve --no-nostr --no-poll --no-oracle --no-persist
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          docker stop ts
      # Push the image that was just smoke-tested (no rebuild).
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          for tag in latest "$sha_tag"; do
            docker tag tokenstats:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "Published $IMAGE:latest and $IMAGE:$sha_tag" >> "$GITHUB_STEP_SUMMARY"
