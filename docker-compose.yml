# tokenstats production stack (app + optional Caddy TLS).
#
# The app image is built and published by CI (ghcr.io/johnzilla/tokenstats),
# so deploys pull instead of compiling on the host:
#   docker compose --profile proxy pull && docker compose --profile proxy up -d
# Pin a build with TOKENSTATS_TAG=sha-<short> in .env (default: latest).
# Build locally instead (dev, or a fork): add --build to `up`.
#
# With Caddy (HTTPS on :80/:443 — recommended on a Droplet): set DOMAIN in
# .env (see deploy/env.example) and use --profile proxy as above.
#
# Logs:  docker compose logs -f tokenstats

services:
  tokenstats:
    image: ghcr.io/johnzilla/tokenstats:${TOKENSTATS_TAG:-latest}
    build: .
    container_name: tokenstats
    restart: unless-stopped
    # Allow time for final SQLite snapshot on stop/restart
    stop_grace_period: 20s
    environment:
      TOKENSTATS_BIND: "0.0.0.0:8080"
      TOKENSTATS_DB: "/data/tokenstats.db"
      TOKENSTATS_LOG_JSON: "true"
      TOKENSTATS_POLL_INTERVAL_SECS: "${TOKENSTATS_POLL_INTERVAL_SECS:-60}"
      TOKENSTATS_BTC_INTERVAL_SECS: "${TOKENSTATS_BTC_INTERVAL_SECS:-60}"
      TOKENSTATS_PERSIST_INTERVAL_SECS: "${TOKENSTATS_PERSIST_INTERVAL_SECS:-30}"
      # Plausible analytics script URL (https). Empty = no third-party script.
      TOKENSTATS_PLAUSIBLE_SCRIPT: "${TOKENSTATS_PLAUSIBLE_SCRIPT:-}"
      # Optional overrides:
      # TOKENSTATS_RELAYS: "wss://relay.damus.io,wss://nos.lol,wss://relay.nostr.band"
      # TOKENSTATS_NODES: "https://your-node.example.com"
      # TOKENSTATS_NO_NOSTR: "true"
      RUST_LOG: "${RUST_LOG:-info,tokenstats=info,tower_http=info}"
    volumes:
      - tokenstats-data:/data
    # Localhost-only by default: Docker-published ports bypass UFW, and Caddy
    # reaches the app over the internal network. For an app-only IP smoke test
    # without Caddy, set TOKENSTATS_PUBLISH_PORT=8080 (all interfaces).
    ports:
      - "${TOKENSTATS_PUBLISH_PORT:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - tokenstats
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # TLS reverse proxy — enable with: docker compose --profile proxy up -d
  caddy:
    profiles: ["proxy"]
    image: caddy:2.9-alpine
    container_name: tokenstats-caddy
    restart: unless-stopped
    depends_on:
      tokenstats:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Comma-separated hostnames OK: tokenstats.ai, www.tokenstats.ai, tokenta.pe
      DOMAIN: "${DOMAIN:-tokenstats.ai}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@tokenstats.ai}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - tokenstats
    security_opt:
      - no-new-privileges:true

volumes:
  tokenstats-data:
  caddy-data:
  caddy-config:

networks:
  tokenstats:
    driver: bridge
